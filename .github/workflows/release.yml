name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if version has changed
        id: check_version
        run: |
          VERSION=$(grep -oP "Version:\s*\K\d+(\.\d+)*" wcpos-web-checkout.php)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          git fetch --prune --unshallow
          if git tag | grep -q "v$VERSION"; then
            echo "Version has not changed. Skipping release..."
            echo "::set-output name=release::false"
          else
            echo "Version has changed. Creating new release..."
            echo "::set-output name=release::true"
          fi

      - name: Create Release
        if: steps.check_version.outputs.release == 'true'
        id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false

      - name: Build and upload ZIP
        if: steps.check_version.outputs.release == 'true'
        run: |
          # WordPress 7.1.4+ unpacks packages into a randomly suffixed folder and installs a flat zip
          # there, so the zip must hold the installed folder (catalog slug) as its only top-level entry.
          mkdir -p "$RUNNER_TEMP/stage/woocommerce-pos-web-checkout-gateway"
          rsync -a --exclude='.git*' ./ "$RUNNER_TEMP/stage/woocommerce-pos-web-checkout-gateway/"
          (cd "$RUNNER_TEMP/stage" && zip -r "$GITHUB_WORKSPACE/woocommerce-pos-web-checkout-gateway.zip" "woocommerce-pos-web-checkout-gateway" -x "*.git*")
          TOP_LEVEL=$(unzip -Z1 woocommerce-pos-web-checkout-gateway.zip | cut -d/ -f1 | sort -u)
          if [ "$TOP_LEVEL" != "woocommerce-pos-web-checkout-gateway" ]; then
            echo "::error::woocommerce-pos-web-checkout-gateway.zip must contain only woocommerce-pos-web-checkout-gateway/ at the top level, found: $TOP_LEVEL"
            exit 1
          fi
          gh release upload v${{ env.VERSION }} woocommerce-pos-web-checkout-gateway.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
